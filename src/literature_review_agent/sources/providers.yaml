# Fournisseurs documentaires de l'Agent Revue de littérature.
#
# PRINCIPE : tout fournisseur GRATUIT et SANS CLÉ utile à l'objectif est déclaré ici ; ajouter un
# fournisseur = configuration, pas de code (sauf nouvel adaptateur). Chaque `host` est une
# destination réseau EXPLICITEMENT autorisée pour les API (anti-SSRF).
#
# family      : sert la sélection déterministe selon la requête
# source_type : priorité documentaire de la SPEC §7
# pdf         : le fournisseur sait-il donner un lien direct de texte intégral ?

providers:
  # ---- publications scientifiques ----
  - id: openalex
    label: "OpenAlex"
    family: publications
    source_type: scientific
    host: api.openalex.org
    adapter: openalex
    pdf: true
    enabled: true

  - id: crossref
    label: "Crossref"
    family: publications
    source_type: scientific
    host: api.crossref.org
    adapter: crossref
    pdf: true
    enabled: true

  # Complète OpenAlex/Crossref : découverte de travaux liés, couverture plus large.
  # Gratuit SANS clé (quota bas). Clé facultative : SEMANTIC_SCHOLAR_API_KEY (en-tête x-api-key).
  - id: semanticscholar
    label: "Semantic Scholar"
    family: publications
    source_type: scientific
    host: api.semanticscholar.org
    adapter: semantic_scholar
    pdf: true
    enabled: true

  # Textes INTÉGRAUX en accès ouvert (et non de simples notices) : utile pour l'étape
  # « trouver et récupérer les textes intégraux ».
  # DÉSACTIVÉ tant que la clé gratuite n'est pas posée (inscription : core.ac.uk/services/api).
  # Clé attendue dans ~/.hermes/.env sous CORE_API_KEY (jamais dans ce fichier), puis enabled: true.
  - id: core
    label: "CORE - textes intégraux en accès ouvert"
    family: publications
    source_type: scientific
    host: api.core.ac.uk
    adapter: core
    pdf: true
    enabled: false

  - id: europepmc
    label: "Europe PMC"
    family: publications
    source_type: scientific
    host: www.ebi.ac.uk
    adapter: europepmc
    pdf: true
    enabled: true

  - id: doaj
    label: "DOAJ - Directory of Open Access Journals"
    family: publications
    source_type: scientific
    host: doaj.org
    adapter: doaj
    pdf: true
    enabled: true

  - id: pubmed
    label: "PubMed - NLM E-utilities"
    family: publications
    source_type: governmental
    host: eutils.ncbi.nlm.nih.gov
    adapter: pubmed
    pdf: false
    enabled: true

  # ---- thèses et travaux universitaires ----
  - id: theses_fr
    label: "theses.fr - thèses françaises"
    family: theses
    source_type: thesis
    host: theses.fr
    adapter: theses_fr
    pdf: false
    enabled: true

  - id: hal
    label: "HAL - dépôts universitaires francophones, thèses incluses"
    family: theses
    source_type: university
    host: api.archives-ouvertes.fr
    adapter: hal
    pdf: true
    enabled: true

  - id: openaire
    label: "OpenAIRE Graph - recherche financée publiquement et dépôts"
    family: repositories
    source_type: institutional
    host: api.openaire.eu
    adapter: openaire
    pdf: true
    enabled: true

  - id: datacite
    label: "DataCite - DOI de données, de thèses et de dépôts"
    family: repositories
    source_type: institutional
    host: api.datacite.org
    adapter: datacite
    pdf: false
    enabled: true

  # ---- dépôts et prépublications ----
  - id: zenodo
    label: "Zenodo - dépôt pluridisciplinaire"
    family: repositories
    source_type: institutional
    host: zenodo.org
    adapter: zenodo
    pdf: true
    enabled: true

  - id: arxiv
    label: "arXiv - prépublications"
    family: repositories
    source_type: preprint
    host: export.arxiv.org
    adapter: arxiv
    pdf: true
    enabled: true

  - id: osf
    label: "OSF Preprints dont AfricArXiv - travaux africains"
    family: repositories
    source_type: preprint
    host: api.osf.io
    adapter: osf
    pdf: true
    enabled: true

  # ---- données publiques et institutionnelles ----
  - id: datagouv
    label: "data.gouv.fr - données publiques françaises"
    family: statistics
    source_type: governmental
    host: www.data.gouv.fr
    adapter: datagouv
    pdf: false
    enabled: true

  - id: dataeuropa
    label: "data.europa.eu - open data européen"
    family: statistics
    source_type: international_org
    host: data.europa.eu
    adapter: dataeuropa
    pdf: false
    enabled: true

enrichment:
  # Service d'enrichissement, pas un moteur de recherche
  - id: unpaywall
    label: "Unpaywall - accès ouvert et texte intégral légal"
    host: api.unpaywall.org
    adapter: unpaywall
    enabled: true
