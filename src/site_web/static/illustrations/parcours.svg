<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" role="img"
     aria-label="Un mémoire se construit étape après étape">
  <!-- Le parcours : une marche d'escalier qui monte, page après page. -->
  <g fill="none" stroke="#0b5d4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="52" y="330" width="76" height="66" rx="7" fill="#f3eee6"/>
    <rect x="148" y="292" width="76" height="104" rx="7" fill="#e6f1ee"/>
    <rect x="244" y="248" width="76" height="148" rx="7" fill="#f3eee6"/>
    <rect x="340" y="196" width="76" height="200" rx="7" fill="#e6f1ee"/>
    <rect x="436" y="140" width="76" height="256" rx="7" fill="#fbeee7"/>
    <rect x="532" y="76" width="76" height="320" rx="7" fill="#0b5d4b" stroke="none"/>
    <!-- lignes de texte sur chaque page -->
    <g stroke="#8aa39c" stroke-width="1.8">
      <path d="M66 348h48M66 362h34"/>
      <path d="M162 312h48M162 326h30"/>
      <path d="M258 270h48M258 284h38"/>
      <path d="M354 220h48M354 234h26"/>
      <path d="M450 166h48M450 180h36"/>
    </g>
    <g stroke="#e6f1ee" stroke-width="1.8" opacity=".85">
      <path d="M546 104h48M546 118h48M546 132h32"/>
    </g>
  </g>
  <!-- la progression, en pointillé, qui relie le sommet de chaque étape -->
  <path d="M90 330 L186 292 L282 248 L378 196 L474 140"
        fill="none" stroke="#b85c38" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round"/>
  <g fill="#ffffff" stroke="#b85c38" stroke-width="2.6">
    <circle cx="90" cy="330" r="7"/>
    <circle cx="186" cy="292" r="7"/>
    <circle cx="282" cy="248" r="7"/>
    <circle cx="378" cy="196" r="7"/>
    <circle cx="474" cy="140" r="7"/>
  </g>
  <circle cx="570" cy="76" r="9" fill="#b85c38"/>
</svg>
