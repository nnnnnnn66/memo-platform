# Agent Sujet V1 — configuration (réglages, jamais de secrets ici)
llm:
  provider: deepseek                 # deepseek | google
  deepseek:
    base_url: https://api.deepseek.com/v1
    model: deepseek-flash
    api_key_env: DEEPSEEK_API_KEY
  google:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-2.5-flash
    api_key_env: GOOGLE_API_KEY
  temperature: 0.2

limits:                              # SPEC §30 — bornes de consommation
  max_input_size: 20000              # caractères
  max_output_tokens: 4000             # 2000 tronquait le JSON de l'Agent Sujet (sujet précis)
  max_tool_calls: 0
  max_agent_turns: 6
  max_verification_retries: 3
  timeout: 30                        # secondes
  max_external_requests: 0           # V1 : aucune recherche externe
  max_search_results: 5

paths:
  workspace: workspace               # artefacts par session
  audit_db: workspace/audit.db       # journal d'audit (SQLite stdlib)

security:
  fail_on_injection: false           # true = bloquer ; false = annoter et continuer
  max_context_file_chars: 20000
