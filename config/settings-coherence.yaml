# Agent 13 — Vérificateur global de cohérence — configuration PROPRE à cet agent.
# (Aucun secret ici : les clés vivent uniquement dans ~/.hermes/.env.)

llm:
  provider: deepseek                 # deepseek | google
  deepseek:
    base_url: https://api.deepseek.com/v1
    model: deepseek-flash
    api_key_env: DEEPSEEK_API_KEY
  google:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-2.5-flash
    api_key_env: GOOGLE_API_KEY
  temperature: 0.1                   # audit : la précision prime sur la variété

limits:
  max_input_size: 200000             # dossier COMPLET des onze étapes
  max_output_tokens: 32000           # modèle raisonneur : les tokens de raisonnement consomment ce budget
  max_agent_turns: 8
  max_verification_retries: 3
  timeout: 120                       # secondes (appel LLM) : audit d'un dossier volumineux
  max_llm_calls: 14                  # P1 (audit) + P2 (rapport) + contrôleur + re-tentatives
  # --- aucun réseau : l'audit ne s'appuie que sur le dossier ---
  max_external_requests: 0
  source_timeout: 25
  max_clarification_queries: 0
  max_results_per_query: 0
  cache_ttl_hours: 336

paths:
  workspace: workspace                             # workspace/<student_id>/<session_id>/
  audit_db: workspace/audit-coherence.db           # journal d'audit (SQLite stdlib)
  cache_db: workspace/coherence-cache.db           # inutilisé en V1 (aucun réseau)

sources:
  enabled: false

security:
  fail_on_injection: false                         # true = bloquer ; false = annoter et continuer
