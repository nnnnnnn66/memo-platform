# Agent Méthodologie (étape 9) — configuration PROPRE à cet agent.
# (Aucun secret ici : les clés vivent uniquement dans ~/.hermes/.env.)

llm:
  provider: deepseek                 # deepseek | google
  deepseek:
    base_url: https://api.deepseek.com/v1
    model: deepseek-flash
    api_key_env: DEEPSEEK_API_KEY
  google:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-2.5-flash
    api_key_env: GOOGLE_API_KEY
  temperature: 0.2

limits:
  max_input_size: 60000              # entrées + diagnostic de l'étape 8 + snapshots amont
  max_output_tokens: 32000           # modèle raisonneur : les tokens de raisonnement consomment
                                     # ce budget ; une limite basse coupe les JSON en plein
  max_agent_turns: 8
  max_verification_retries: 3
  timeout: 90                        # secondes (appel LLM)
  max_llm_calls: 44                  # P1 + P2 + P3 + P4 + vérificateur + re-tentatives, avec une
                                     # MARGE : sur un dossier riche (diagnostic détaillé, matrice
                                     # complète), 22 appels étaient atteints EN PLEINE CAMPAGNE et
                                     # l'étape échouait sur RESOURCE_LIMIT (défaut réel constaté en
                                     # rejouant un dossier complet).
                                     # + reformulations sur corrections
  # --- recherche méthodologique réelle (bornée) ---
  # L'agent va CHERCHER des références de méthode (échantillonnage, instruments, analyse) au lieu
  # de réclamer à l'étudiant ce qu'il ne peut pas savoir. Seul le TERRAIN se demande.
  max_external_requests: 36
  source_timeout: 25
  max_clarification_queries: 3
  max_results_per_query: 8
  cache_ttl_hours: 336

paths:
  workspace: workspace                             # workspace/<student_id>/<session_id>/
  audit_db: workspace/audit-methode.db             # journal d'audit (SQLite stdlib)
  cache_db: workspace/methode-cache.db             # cache des requêtes méthodologiques

sources:
  enabled: true
  user_agent: "memo-platform/0.1 (accompagnement memoire; contact: etudiant@example.org)"
  polite_email: "etudiant@example.org"
  max_response_bytes: 3000000
  providers_file: providers.yaml
  polite_delay_seconds: 0.4
  retry_on_transient: 2
  max_retry_wait: 5.0

research:
  # Références méthodologiques présentées au modèle. Elles sont RÉELLES : le modèle ne peut citer
  # que celles-là (une référence inventée est refusée par les contrôles).
  max_sources: 12

security:
  fail_on_injection: false                         # true = bloquer ; false = annoter et continuer
